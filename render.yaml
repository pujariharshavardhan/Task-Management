# Render Blueprint: one web service serves the React app and the FastAPI API from a single HTTPS address.
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance -> pick this repo.
services:
  - type: web
    name: task-management
    runtime: python
    plan: free
    rootDir: .
    buildCommand: >-
      cd frontend && npm ci && SITE_URL=$RENDER_EXTERNAL_URL npm run build &&
      cd ../backend && pip install -r requirements.txt
    startCommand: >-
      cd backend && alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: NODE_VERSION
        value: "22"
      - key: ENVIRONMENT
        value: production
      # Neon pooled connection string; entered in the dashboard, never committed
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Render already redirects http -> https at its edge
      - key: FORCE_HTTPS
        value: "false"
      - key: ALLOWED_HOSTS
        value: '["*"]'
      - key: VITE_ORG_NAME
        value: APMS
